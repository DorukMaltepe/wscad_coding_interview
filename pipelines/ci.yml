# CI: build once, run every test level, build the installer, test the installer, publish artifacts.
# Runs after each merge to main. Every run that fully succeeds is a release candidate for release.yml.

name: $(majorMinor).$(Rev:r) # Becomes the app and MSI version, e.g. 1.0.42.

trigger:
  batch: true
  branches:
    include:
      - main
  # Changes that cannot affect the product don't spend UI agent time or signing operations.
  paths:
    exclude:
      - '**/*.md'
      - monitoring

pr: none

variables:
  - name: majorMinor
    value: '1.0'
  # AppInsightsConnectionString: the `connectionString` output of monitoring/main.bicep.
  - group: DesktopApp-Telemetry

stages:
  - stage: Build
    displayName: Build and test
    pool: Windows-Build
    jobs:
      - job: Build
        steps:
          - template: templates/build-and-test.yml
            parameters:
              version: $(Build.BuildNumber)
              appInsightsConnectionString: $(AppInsightsConnectionString)
              codeAnalysis: true

          # PDBs stay out of the MSI; crash dumps from customers are resolved against the symbol server instead.
          - task: PublishSymbols@2
            displayName: Publish symbols
            inputs:
              SymbolsFolder: $(Build.SourcesDirectory)/src
              SearchPattern: '**/bin/Release/**/DesktopApp*.pdb'
              SymbolServerType: TeamServices
              IndexSources: false # Portable PDBs; the SDK embeds Source Link instead.

          # Signed before the artifact exists, so UI tests, the MSI and the installer tests all use the signed binaries.
          - template: templates/sign.yml
            parameters:
              folder: $(Build.ArtifactStagingDirectory)/app
              files: DesktopApp.exe DesktopApp*.dll

          - publish: $(Build.ArtifactStagingDirectory)/app
            artifact: app
            displayName: Publish app artifact

          - publish: tests/DesktopApp.UITests/bin/Release/net10.0-windows
            artifact: uitests
            displayName: Publish UI test artifact

          - publish: tests/DesktopApp.Installer.Tests/bin/Release/net10.0-windows
            artifact: installertests
            displayName: Publish installer test artifact

  - stage: UITests
    displayName: UI tests
    dependsOn: Build
    # Dedicated pool: its agent runs in an interactive, auto-logged-on session
    # (configured with --runAsAutoLogon), not as a Windows service, so the app can show real windows.
    pool: Windows-UI-Interactive
    jobs:
      - job: UITests
        timeoutInMinutes: 30 # The agent is scarce: a hung run must not block it for the default 60 minutes.
        workspace:
          clean: all # No artifacts left over from an earlier run.
        steps:
          - template: templates/prepare-test-agent.yml

          - download: current
            artifact: app

          - download: current
            artifact: uitests

          # Tests the exact binaries that go into the installer, not a rebuild.
          # UI tests and app lifecycle/crash tests (startup, saved data, bad input, crash logging).
          # A failed test gets a screenshot and the crash log attached; a hung test gets a dump.
          - script: >-
              dotnet test $(Pipeline.Workspace)/uitests/DesktopApp.UITests.dll
              --blame-hang-timeout 5m
              --logger trx --results-directory $(Agent.TempDirectory)/TestResults
            displayName: Run UI and app tests
            env:
              DESKTOPAPP_EXE: $(Pipeline.Workspace)/app/DesktopApp.exe

          - task: PublishTestResults@2
            displayName: Publish UI test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: $(Agent.TempDirectory)/TestResults
              testRunTitle: UI tests

  - stage: Package
    displayName: Build installer
    # Waits for UI tests too, so an installer never exists for a build that failed them.
    dependsOn:
      - Build
      - UITests
    pool: Windows-Build
    jobs:
      - job: Installer
        steps:
          - checkout: self
            clean: true

          - download: current
            artifact: app

          - template: templates/use-dotnet.yml

          - task: NuGetAuthenticate@1
            displayName: Authenticate to Azure Artifacts feed

          - template: templates/installer.yml
            parameters:
              appDir: $(Pipeline.Workspace)/app
              version: $(Build.BuildNumber)
              outputDir: $(Build.ArtifactStagingDirectory)/installer

          # Signed MSI: no "unknown publisher" UAC prompt, and SmartScreen reputation builds up.
          - template: templates/sign.yml
            parameters:
              folder: $(Build.ArtifactStagingDirectory)/installer
              files: '*.msi'

          - publish: $(Build.ArtifactStagingDirectory)/installer
            artifact: installer
            displayName: Publish installer artifact

  - stage: InstallerTests
    displayName: Installer tests
    dependsOn: Package
    # Installs, starts and uninstalls the MSI for real, so it needs a desktop session and admin rights.
    # The agent account must be a local administrator. Use a disposable or reset machine: tests change Program Files.
    pool: Windows-UI-Interactive
    jobs:
      - job: InstallerTests
        timeoutInMinutes: 30
        workspace:
          clean: all # Stale files next to the app artifact would break the exact payload comparison.
        steps:
          - template: templates/prepare-test-agent.yml

          - download: current
            artifact: installer

          - download: current
            artifact: app

          - download: current
            artifact: installertests

          # Tests the exact MSI that release.yml will publish. A failure here fails the CI run, and release.yml
          # refuses any run whose InstallerTests stage did not succeed. A failed install test gets its full msiexec logs attached.
          - script: dotnet test $(Pipeline.Workspace)/installertests/DesktopApp.Installer.Tests.dll --logger trx --results-directory $(Agent.TempDirectory)/TestResults
            displayName: Run installer tests
            env:
              DESKTOPAPP_MSI: $(Pipeline.Workspace)/installer/DesktopApp-$(Build.BuildNumber).msi
              DESKTOPAPP_APP_DIR: $(Pipeline.Workspace)/app
              DESKTOPAPP_VERSION: $(Build.BuildNumber)
              DESKTOPAPP_REQUIRE_ELEVATED: 'true' # A skipped install test must not pass silently.

          - task: PublishTestResults@2
            displayName: Publish installer test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: $(Agent.TempDirectory)/TestResults
              testRunTitle: Installer tests
