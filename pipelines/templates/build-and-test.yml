# Restore, build, unit and integration tests.
# Shared by PR validation and CI, so a PR is checked exactly the way main is built.

parameters:
  - name: version
    type: string
    default: '1.0.0'

steps:
  - checkout: self
    clean: true

  - task: UseDotNet@2
    displayName: Use .NET SDK from global.json
    inputs:
      useGlobalJson: true

  - task: UseDotNet@2
    displayName: Use .NET 10 runtime (test target)
    inputs:
      packageType: runtime
      version: 10.0.x

  - task: NuGetAuthenticate@1
    displayName: Authenticate to Azure Artifacts feed

  - script: dotnet restore DesktopApp.slnx
    displayName: Restore

  - script: dotnet build DesktopApp.slnx --no-restore -c Release -p:Version=${{ parameters.version }}
    displayName: Build

  - script: dotnet test tests/DesktopApp.Core.Tests --no-build -c Release --logger trx --results-directory $(Agent.TempDirectory)/TestResults
    displayName: Unit tests

  - script: dotnet test tests/DesktopApp.IntegrationTests --no-build -c Release --logger trx --results-directory $(Agent.TempDirectory)/TestResults
    displayName: Integration tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: $(Agent.TempDirectory)/TestResults
      testRunTitle: Unit and integration tests
